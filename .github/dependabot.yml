version: 2
updates:
  # Keep the GitHub Actions used by CI patched and pinned. Dependabot opens PRs
  # when a newer version is available (and flags unpinned/moving tags).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keep the NuGet packages used by the service and its tests patched.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
