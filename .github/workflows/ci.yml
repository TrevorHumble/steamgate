name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# gate-integrity always runs. build-test builds SteamGate on a Windows runner, runs the unit tests
# and the mutation tests, then installs the published service and helper and checks that Windows restarts a killed service,
# that a game started after the limit is closed, and that bad pipe clients cannot stop the service.

jobs:
  gate-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit-gate integrity (server-side backstop)
        run: |
          test -f .githooks/pre-commit || { echo "commit gate missing: .githooks/pre-commit"; exit 1; }
          git check-attr text eol -- .githooks/pre-commit | grep -q 'eol: lf' \
            || { echo "commit gate not LF-protected (autocrlf could corrupt it)"; exit 1; }
          head -1 .githooks/pre-commit | grep -q '^#!/bin/sh' \
            || { echo "commit gate shebang corrupt"; exit 1; }

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test -c Release

      - name: Restore pinned tools
        run: dotnet tool restore

      - name: Mutation tests (Stryker.NET, breaks below 80%)
        run: dotnet stryker

      - name: Publish the service
        run: dotnet publish src/SteamGate.Service -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o out

      - name: Publish the helper
        run: dotnet publish src/SteamGate.Helper -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - name: Add the install and uninstall scripts and their shared file
        run: Copy-Item install/Install-SteamGate.ps1, install/Uninstall-SteamGate.ps1, install/SteamGate.Common.ps1 -Destination out

      - name: Install test (install, kill, restart, upgrade, uninstall, enforcement, pipe)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File install/Test-Install.ps1 -PublishDir out

      - name: Upload the install package
        uses: actions/upload-artifact@v4
        with:
          name: steamgate-win-x64
          path: out
          if-no-files-found: error
